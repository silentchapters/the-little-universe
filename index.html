
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Universe | 3D Solar System</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;overflow:hidden;
  background:#030611;color:#f3f5ff;
  font-family:Arial,Helvetica,sans-serif
}
canvas{display:block}
#space{position:fixed;inset:0}
header{
  position:fixed;top:22px;left:25px;
  z-index:2;pointer-events:none
}
.eyebrow{
  font-size:10px;letter-spacing:4px;
  color:#9ebcff;text-transform:uppercase
}
h1{
  font-size:32px;margin:8px 0;
  letter-spacing:-1px;font-weight:600
}
.subtitle{font-size:12px;color:#aab5d2}
.panel{
  position:fixed;right:25px;top:50%;
  transform:translateY(-50%);
  width:250px;padding:19px;
  background:rgba(9,16,36,.78);
  border:1px solid #283657;border-radius:17px;
  backdrop-filter:blur(15px);
  z-index:2
}
.panel small{
  color:#91b5ff;letter-spacing:2px;
  text-transform:uppercase
}
.panel h2{font-size:25px;margin:9px 0}
.panel p{
  font-size:12px;line-height:1.6;
  color:#bdc8df
}
.facts{
  display:grid;grid-template-columns:1fr 1fr;
  gap:9px;margin-top:15px
}
.fact{
  background:#ffffff0c;padding:10px;
  border-radius:9px
}
.fact span{
  display:block;font-size:9px;
  color:#8799bd;text-transform:uppercase
}
.fact strong{font-size:11px;display:block;margin-top:6px}
.planets{
  position:fixed;left:22px;bottom:85px;
  padding:10px;background:#091020bd;
  border:1px solid #293754;border-radius:13px;
  display:flex;flex-direction:column;gap:4px;
  z-index:2
}
.planets button{
  background:transparent;border:0;color:#bdc9e5;
  padding:6px 10px;text-align:left;
  border-radius:7px;cursor:pointer;font-size:11px
}
.planets button:hover,.planets button.active{
  background:#668eea30;color:white
}
.controls{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;
  background:#091020d9;border:1px solid #293754;
  padding:10px;border-radius:13px;z-index:3;
  backdrop-filter:blur(12px)
}
.controls button{
  background:#ffffff12;color:white;
  border:1px solid #52658b66;
  border-radius:8px;padding:9px 12px;
  cursor:pointer;font-size:11px
}
.controls button:hover{background:#547bdc55}
.speed{
  font-size:10px;color:#b9c8e9;
  display:flex;align-items:center;gap:6px
}
input{width:75px;accent-color:#9bbcff}
#loading{
  position:fixed;inset:0;z-index:10;
  display:grid;place-items:center;
  background:#030611;color:#a9c4ff;
  letter-spacing:3px;font-size:12px;
  transition:opacity 1s
}
#loading.done{opacity:0;pointer-events:none}

@media(max-width:650px){
  header{top:14px;left:15px}
  h1{font-size:25px}
  .subtitle{font-size:10px}
  .panel{
    right:12px;bottom:83px;top:auto;
    transform:none;width:190px;padding:12px
  }
  .panel h2{font-size:19px}
  .panel p{font-size:10px}
  .fact{padding:7px}
  .fact strong{font-size:10px}
  .planets{left:10px;bottom:85px;padding:6px}
  .planets button{font-size:10px;padding:5px}
  .controls{bottom:10px;gap:5px;padding:7px}
  .controls button{padding:8px;font-size:10px}
  input{width:48px}
}
@media(max-width:390px){
  .planets{display:none}
  .panel{width:180px}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<div id="space"></div>
<div id="loading">PREPARING YOUR UNIVERSE...</div>

<header>
 <div class="eyebrow">An Explorer's Window</div>
 <h1>Little Universe</h1>
 <div class="subtitle">Eight worlds. One star. Endless wonder.</div>
</header>

<div class="planets" id="planetButtons"></div>

<section class="panel">
 <small>Your destination</small>
 <h2 id="name">Earth</h2>
 <p id="description">Our beautiful blue home, a living world surrounded by oceans and clouds.</p>
 <div class="facts">
  <div class="fact"><span>Day length</span><strong id="day">24 hours</strong></div>
  <div class="fact"><span>Year length</span><strong id="year">365 days</strong></div>
  <div class="fact"><span>Planet type</span><strong id="type">Terrestrial</strong></div>
  <div class="fact"><span>Moons</span><strong id="moons">1</strong></div>
 </div>
</section>

<div class="controls">
 <button id="pause">Ⅱ Pause</button>
 <button id="home">◎ Home</button>
 <div class="speed">
  Orbit <input id="speed" type="range" min="0" max="3" step=".1" value="1">
  <span id="speedText">1×</span>
 </div>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030611);
scene.fog=new THREE.FogExp2(0x030611,.0009);

const camera=new THREE.PerspectiveCamera(
 45,innerWidth/innerHeight,.1,1500
);
camera.position.set(0,75,135);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;
document.getElementById("space").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.045;
controls.minDistance=12;
controls.maxDistance=260;
controls.maxPolarAngle=Math.PI*.88;

// LIGHTING
scene.add(new THREE.AmbientLight(0x8291c5,.65));

const sunlight=new THREE.PointLight(0xffd59a,1600,500,1.5);
scene.add(sunlight);

// STARS
const starPositions=[];
for(let i=0;i<4000;i++){
 const r=250+Math.random()*550;
 const theta=Math.random()*Math.PI*2;
 const phi=Math.acos(2*Math.random()-1);
 starPositions.push(
  r*Math.sin(phi)*Math.cos(theta),
  r*Math.cos(phi),
  r*Math.sin(phi)*Math.sin(theta)
 );
}
const starGeometry=new THREE.BufferGeometry();
starGeometry.setAttribute(
 "position",
 new THREE.Float32BufferAttribute(starPositions,3)
);
const starField=new THREE.Points(
 starGeometry,
 new THREE.PointsMaterial({
  color:0xd6e2ff,size:1.1,
  sizeAttenuation:true,transparent:true,opacity:.9
 })
);
scene.add(starField);


// SUN GLOW TEXTURE
function glowTexture(){
 const c=document.createElement("canvas");
 c.width=c.height=512;

 const ctx=c.getContext("2d");
 const g=ctx.createRadialGradient(256,256,5,256,256,256);

 g.addColorStop(0,"rgba(255,255,190,1)");
 g.addColorStop(.18,"rgba(255,220,80,.9)");
 g.addColorStop(.38,"rgba(255,165,35,.45)");
 g.addColorStop(.65,"rgba(255,110,15,.16)");
 g.addColorStop(1,"rgba(255,80,0,0)");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,512,512);

 return new THREE.CanvasTexture(c);
}

// SUN'S GOLDEN-ORANGE SURFACE
function makeSunTexture(){
 const c=document.createElement("canvas");
 c.width=1024;
 c.height=512;

 const ctx=c.getContext("2d");

 const gradient=ctx.createLinearGradient(0,0,0,512);
 gradient.addColorStop(0,"#ffad28");
 gradient.addColorStop(.25,"#ffca36");
 gradient.addColorStop(.5,"#ffed72");
 gradient.addColorStop(.75,"#ffb52b");
 gradient.addColorStop(1,"#f47716");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,1024,512);

 // Flowing orange and golden surface patterns
 for(let i=0;i<900;i++){
  const x=Math.random()*1024;
  const y=Math.random()*512;

  ctx.globalAlpha=.08+Math.random()*.2;
  ctx.fillStyle=Math.random()>.5?"#fff3a0":"#e9570b";

  ctx.beginPath();
  ctx.ellipse(
   x,y,
   5+Math.random()*35,
   2+Math.random()*9,
   Math.random()*Math.PI,
   0,Math.PI*2
  );
  ctx.fill();
 }

 ctx.globalAlpha=1;

 const texture=new THREE.CanvasTexture(c);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}


const sun=new THREE.Mesh(
 new THREE.SphereGeometry(5.5,64,64),
 new THREE.MeshBasicMaterial({color:0xffc15b})
);
scene.add(sun);

const sunCorona=new THREE.Sprite(
 new THREE.SpriteMaterial({
  map:glowTexture(),transparent:true,
  blending:THREE.AdditiveBlending,
  depthWrite:false
 })
);
sunCorona.scale.set(48,48,1);
scene.add(sunCorona);

// PROCEDURAL PLANET TEXTURES
function makeTexture(base,dark,light,style){
 const c=document.createElement("canvas");
 c.width=1024;c.height=512;
 const ctx=c.getContext("2d");

 const gradient=ctx.createLinearGradient(0,0,0,512);
 gradient.addColorStop(0,light);
 gradient.addColorStop(.5,base);
 gradient.addColorStop(1,dark);
 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,1024,512);

 if(style==="gas"){
  for(let y=0;y<512;y+=12){
   ctx.globalAlpha=.12+Math.random()*.15;
   ctx.fillStyle=Math.random()>.5?"#ffffff":"#382d32";
   ctx.fillRect(0,y,1024,3+Math.random()*8);
  }
 }else{
  for(let i=0;i<3500;i++){
   ctx.globalAlpha=Math.random()*.22;
   ctx.fillStyle=Math.random()>.5?"#ffffff":"#10101b";
   const x=Math.random()*1024;
   const y=Math.random()*512;
   ctx.beginPath();
   ctx.arc(x,y,Math.random()*5+.5,0,Math.PI*2);
   ctx.fill();
  }
 }

 if(style==="earth"){
  ctx.globalAlpha=.8;
  for(let i=0;i<35;i++){
   ctx.fillStyle=Math.random()>.5?"#739d63":"#a0a66d";
   ctx.beginPath();
   ctx.ellipse(
    Math.random()*1024,Math.random()*512,
    15+Math.random()*65,10+Math.random()*35,
    Math.random()*3,0,Math.PI*2
   );
   ctx.fill();
  }
  ctx.globalAlpha=.22;
  ctx.fillStyle="#ffffff";
  for(let i=0;i<100;i++){
   ctx.beginPath();
   ctx.ellipse(Math.random()*1024,Math.random()*512,
    20+Math.random()*40,2+Math.random()*7,0,0,Math.PI*2);
   ctx.fill();
  }
 }
 ctx.globalAlpha=1;

 const texture=new THREE.CanvasTexture(c);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

// EARTH'S PROCEDURAL CLOUD TEXTURE
function makeCloudTexture(){
 const canvas=document.createElement("canvas");
 canvas.width=1024;
 canvas.height=512;

 const ctx=canvas.getContext("2d");

 // Transparent background
 ctx.clearRect(0,0,1024,512);

 // Create many soft, irregular cloud formations
 for(let i=0;i<450;i++){
  const x=Math.random()*1024;
  const y=Math.random()*512;

  const width=8+Math.random()*65;
  const height=3+Math.random()*15;

  ctx.globalAlpha=.12+Math.random()*.25;
  ctx.fillStyle="#ffffff";

  ctx.beginPath();
  ctx.ellipse(
   x,y,width,height,
   Math.random()*Math.PI,
   0,Math.PI*2
  );
  ctx.fill();

  // Additional smaller cloud details
  ctx.beginPath();
  ctx.ellipse(
   x+width*.45,
   y+height*.3,
   width*.45,
   height*.8,
   Math.random(),
   0,Math.PI*2
  );
  ctx.fill();
 }

 ctx.globalAlpha=1;

 const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 return texture;
}

// CLOUD LAYERS
const cloudLayers={};

// PLANET INFORMATION
const data=[
 {
  name:"Mercury",radius:.8,orbit:11,speed:1.60,
  colors:["#a69d92","#514b49","#d1c0a9","rock"],
  day:"58.6 Earth days",year:"88 Earth days",
  type:"Terrestrial",moons:"0",
  desc:"A small, cratered world racing around the Sun. Its ancient surface is rugged and almost airless."
 },
 {
  name:"Venus",radius:1.15,orbit:16,speed:1.17,
  colors:["#d5a15f","#87502e","#f3d5a0","rock"],
  day:"243 Earth days",year:"225 Earth days",
  type:"Terrestrial",moons:"0",
  desc:"A brilliant cloud-covered planet with a crushing atmosphere and the hottest surface in the Solar System."
 },
 {
  name:"Earth",radius:1.3,orbit:22,speed:1,
  colors:["#1768a9","#062e66","#76c9ed","earth"],
  day:"24 hours",year:"365 days",
  type:"Terrestrial",moons:"1",
  desc:"Our beautiful blue home, a living world surrounded by oceans, clouds and a protective atmosphere."
 },
 {
  name:"Mars",radius:.95,orbit:29,speed:.8,
  colors:["#b95032","#56251c","#eb9066","rock"],
  day:"24.6 hours",year:"687 Earth days",
  type:"Terrestrial",moons:"2",
  desc:"The red planet, a cold dusty world of giant volcanoes, deep valleys and ancient riverbeds."
 },
 {
  name:"Jupiter",radius:3.5,orbit:43,speed:.43,
  colors:["#c28d6b","#704b3c","#f0d1a3","gas"],
  day:"9.9 hours",year:"11.9 Earth years",
  type:"Gas giant",moons:"95 known",
  desc:"King of the planets. Its enormous atmosphere contains powerful storms, including the Great Red Spot."
 },
 {
  name:"Saturn",radius:3,orbit:61,speed:.30,
  colors:["#c7a978","#705940","#ead7a9","gas"],
  day:"10.7 hours",year:"29.4 Earth years",
  type:"Gas giant",moons:"146 known",
  desc:"A magnificent gas giant surrounded by spectacular rings made mostly of ice and rocky particles."
 },
 {
  name:"Uranus",radius:2.05,orbit:79,speed:.21,
  colors:["#65c6cf","#347b8d","#b5f0ec","gas"],
  day:"17.2 hours",year:"84 Earth years",
  type:"Ice giant",moons:"28 known",
  desc:"An icy blue giant that rotates almost on its side, giving it some extraordinary seasons."
 },
 {
  name:"Neptune",radius:2,orbit:97,speed:.16,
  colors:["#3159c1","#102d78","#719bff","gas"],
  day:"16.1 hours",year:"165 Earth years",
  type:"Ice giant",moons:"16 known",
  desc:"A distant blue world with fierce winds and enormous storms, far beyond the warmth of the Sun."
 }
];

const planets={};
const clickable=[];
const buttons=document.getElementById("planetButtons");

function createOrbit(radius){
 const points=[];
 for(let i=0;i<=300;i++){
  const a=i/300*Math.PI*2;
  points.push(new THREE.Vector3(
   Math.cos(a)*radius,0,Math.sin(a)*radius
  ));
 }
 const geometry=new THREE.BufferGeometry().setFromPoints(points);
 const line=new THREE.LineLoop(
  geometry,
  new THREE.LineBasicMaterial({
   color:0x7186b6,transparent:true,opacity:.24
  })
 );
 scene.add(line);
}

data.forEach((p,index)=>{
 createOrbit(p.orbit);

 const pivot=new THREE.Group();
 scene.add(pivot);

 const material=new THREE.MeshStandardMaterial({
  map:makeTexture(...p.colors),
  roughness:.9,
  metalness:.02
 });

 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(p.radius,64,48),
  material
 );
 mesh.position.x=p.orbit;
 mesh.userData.name=p.name;
 pivot.add(mesh);

// EARTH'S MOVING CLOUD LAYER
if(p.name==="Earth"){

 const cloudMaterial=new THREE.MeshBasicMaterial({
  map:makeCloudTexture(),
  transparent:true,
  opacity:.65,
  depthWrite:false
 });

 const cloudMesh=new THREE.Mesh(
  new THREE.SphereGeometry(
   p.radius*1.018,
   64,48
  ),
  cloudMaterial
 );

 mesh.add(cloudMesh);

 cloudLayers.Earth=cloudMesh;
}

 // ATMOSPHERIC HALO
 if(["Earth","Venus","Uranus","Neptune"].includes(p.name)){
  const halo=new THREE.Mesh(
   new THREE.SphereGeometry(p.radius*1.06,48,32),
   new THREE.MeshBasicMaterial({
    color:p.name==="Earth"?0x59aaff:new THREE.Color(p.colors[0]),
    transparent:true,opacity:.12,
    side:THREE.BackSide
   })
  );
  mesh.add(halo);
 }

 // SATURN'S RINGS
 if(p.name==="Saturn"){
  const ring=new THREE.Mesh(
   new THREE.RingGeometry(p.radius*1.3,p.radius*2.2,128),
   new THREE.MeshStandardMaterial({
    color:0xd1bb91,
    side:THREE.DoubleSide,
    transparent:true,opacity:.8,
    roughness:1
   })
  );
  ring.rotation.x=Math.PI/2.25;
  mesh.add(ring);
 }

 planets[p.name]={pivot,mesh,data:p};
 clickable.push(mesh);

 const button=document.createElement("button");
 button.textContent="●  "+p.name;
 button.dataset.name=p.name;
 button.onclick=()=>selectPlanet(p.name);
 buttons.appendChild(button);
});

// 🌙 THE MOON — EARTH'S COMPANION
const moonOrbit=new THREE.Group();

// Place the Moon's orbital centre at Earth's position
moonOrbit.position.x=planets.Earth.data.orbit;
planets.Earth.pivot.add(moonOrbit);

// Visible orbital path around Earth
const moonOrbitPoints=[];
for(let i=0;i<=120;i++){
 const angle=i/120*Math.PI*2;
 moonOrbitPoints.push(new THREE.Vector3(
  Math.cos(angle)*3.5,
  0,
  Math.sin(angle)*3.5
 ));
}

const moonOrbitLine=new THREE.LineLoop(
 new THREE.BufferGeometry().setFromPoints(moonOrbitPoints),
 new THREE.LineBasicMaterial({
  color:0xc4cde2,
  transparent:true,
  opacity:.28
 })
);
moonOrbit.add(moonOrbitLine);

// Moon surface
const moonMesh=new THREE.Mesh(
 new THREE.SphereGeometry(.38,48,32),
 new THREE.MeshStandardMaterial({
  map:makeTexture(
   "#aaa9a5",
   "#55545a",
   "#dedbd2",
   "rock"
  ),
  roughness:1
 })
);

moonMesh.position.x=3.5;
moonMesh.userData.name="Moon";
moonOrbit.add(moonMesh);

// Moon information
const moonData={
 name:"Moon",
 radius:.38,
 orbit:3.5,
 speed:2.5,
 day:"27.3 Earth days",
 year:"27.3 Earth days",
 type:"Natural satellite",
 moons:"0",
 desc:"Earth's natural companion. A cratered, rocky world that travels around our planet while keeping nearly the same face turned toward us."
};

planets.Moon={
 pivot:moonOrbit,
 mesh:moonMesh,
 data:moonData
};

clickable.push(moonMesh);

// Add Moon to the selection panel
const moonButton=document.createElement("button");
moonButton.textContent="●  Moon";
moonButton.dataset.name="Moon";
moonButton.onclick=()=>selectPlanet("Moon");
buttons.appendChild(moonButton);

// SELECT A PLANET
function selectPlanet(name,focus=true){
 const item=planets[name];
 if(!item)return;

 const p=item.data;
 document.getElementById("name").textContent=p.name;
 document.getElementById("description").textContent=p.desc;
 document.getElementById("day").textContent=p.day;
 document.getElementById("year").textContent=p.year;
 document.getElementById("type").textContent=p.type;
 document.getElementById("moons").textContent=p.moons;

 document.querySelectorAll(".planets button").forEach(b=>{
  b.classList.toggle("active",b.dataset.name===name);
 });

 if(focus){
  const world=new THREE.Vector3();
  item.mesh.getWorldPosition(world);

  const direction=new THREE.Vector3(1,.55,1).normalize();
  const distance=Math.max(10,p.radius*5.5);
  const destination=world.clone().addScaledVector(direction,distance);

  const start=camera.position.clone();
  const startTarget=controls.target.clone();
  const startTime=performance.now();

  function move(now){
   const t=Math.min(1,(now-startTime)/850);
   const eased=1-Math.pow(1-t,3);
   camera.position.lerpVectors(start,destination,eased);
   controls.target.lerpVectors(startTarget,world,eased);
   if(t<1)requestAnimationFrame(move);
  }
  requestAnimationFrame(move);
 }
}

// PLANET CLICKING
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown",event=>{
 pointer.x=event.clientX/innerWidth*2-1;
 pointer.y=-(event.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(clickable,false);
 if(hits.length)selectPlanet(hits[0].object.userData.name);
});

// CONTROLS
let paused=false;

document.getElementById("pause").onclick=e=>{
 paused=!paused;
 e.currentTarget.textContent=paused?"▶ Resume":"Ⅱ Pause";
};

document.getElementById("home").onclick=()=>{
 camera.position.set(0,75,135);
 controls.target.set(0,0,0);
 selectPlanet("Earth",false);
};

const speedInput=document.getElementById("speed");
speedInput.oninput=()=>{
 document.getElementById("speedText").textContent=
 Number(speedInput.value).toFixed(1).replace(".0","")+"×";
};


// ANIMATION
let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const delta=Math.min((now-previous)/1000,.05);
 previous=now;

 if(!paused){
  const multiplier=Number(speedInput.value);

  sun.rotation.y+=delta*.1;
  sunCorona.material.rotation+=delta*.015;

  Object.values(planets).forEach(({pivot,mesh,data:p})=>{

   // PLANET REVOLUTION AROUND THE SUN
   pivot.rotation.y+=delta*p.speed*.16*multiplier;

  // PLANET ROTATION ON ITS OWN AXIS
if(p.name==="Moon"){
 mesh.rotation.y+=delta*p.speed*.16*multiplier;
}else{
 mesh.rotation.y+=delta*
  (p.name==="Venus"?-.34:.55)*multiplier;
}

   // INDEPENDENT CLOUD MOVEMENT
   if(cloudLayers[p.name]){
    cloudLayers[p.name].rotation.y+=
     delta*.12*multiplier;
   }

  });

  starField.rotation.y+=delta*.002;
 }

 controls.update();
 renderer.render(scene,camera);
}

requestAnimationFrame(animate);


// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

selectPlanet("Earth",false);

setTimeout(()=>{
 document.getElementById("loading").classList.add("done");
},800);

</script>
</body>
</html>
